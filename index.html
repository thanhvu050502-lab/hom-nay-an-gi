*{box-sizing:border-box}

.card{background:var(--card);border-radius:22px;padding:14px}

/* ---------- local storage database (miễn phí, lưu trong trình duyệt) ---------- */
function localDB(){var subs={},mem={};
 function key(c){return 'hnag-db-'+c;}
 function load(c){var m=ls(key(c));return m||mem[c]||{};}
 function store(c,m){mem[c]=m;return lsSet(key(c),m);}
 function emit(c){var m=load(c);(subs[c]||[]).forEach(function(cb){cb({docs:Object.keys(m).map(function(id){return {id:id,data:function(){return m[id];}};})});});}
 window.addEventListener('storage',function(e){if(e.key&&e.key.indexOf('hnag-db-')===0)emit(e.key.slice(8));});
 return {collection:function(c){return {
  doc:function(id){return {
   set:function(b){var m=load(c);m[id]=b;return store(c,m)?Promise.resolve():Promise.reject({code:'quota_exceeded'});},
   delete:function(){var m=load(c);delete m[id];store(c,m);return Promise.resolve();}};},
  onSnapshot:function(cb){(subs[c]=subs[c]||[]).push(cb);setTimeout(function(){emit(c);},0);}};}};}

/* ---------- data ---------- */
function qById(id){for(var i=0;i<S.quan.length;i++)if(S.quan[i].id===id)return S.quan[i];return null;}
function bodyOf(o){var b={};for(var k in o)if(k!=='id'&&o[k]!==undefined)b[k]=o[k];return b;}
function saveQ(q){var i=S.quan.findIndex(function(x){return x.id===q.id;});if(i<0)S.quan.push(q);else S.quan[i]=q;
 if(db)return db.collection('quan').doc(q.id).set(bodyOf(q)).catch(werr);return Promise.resolve();}
function delQ(id){S.quan=S.quan.filter(function(x){return x.id!==id;});if(db)return db.collection('quan').doc(id).delete().catch(werr);return Promise.resolve();}
function saveB(b){var i=S.bua.findIndex(function(x){return x.id===b.id;});if(i<0)S.bua.push(b);else S.bua[i]=b;
 if(db)return db.collection('bua').doc(b.id).set(bodyOf(b)).catch(werr);return Promise.resolve();}
function delB(id){S.bua=S.bua.filter(function(x){return x.id!==id;});if(db)return db.collection('bua').doc(id).delete().catch(werr);return Promise.resolve();}
function werr(e){snack(e&&e.code==='quota_exceeded'?'Bộ nhớ trình duyệt đã đầy, chưa lưu được.':'Chưa lưu được thay đổi vừa rồi.');}
function mapDocs(sn){return sn.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;if(OLDF[o.form])o.form=OLDF[o.form];return o;});}
function init(){
 db=localDB();S.dbOk=lsOk();
 db.collection('quan').onSnapshot(function(sn){S.quan=mapDocs(sn);S.loaded=true;soft();});
 db.collection('bua').onSnapshot(function(sn){S.bua=mapDocs(sn);soft();});
}
function soft(){var a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)){S.pending=true;return;}if(S.busy){S.pending=true;return;}render();}

/* ---------- logic ---------- */
function isSweet(q){return SWEET.indexOf(q.form)>=0;}
function bandsOf(q){return isSweet(q)?DRINK:FOOD;}
function priceTxt(q){if(q.pmin==null)return '';var b=bandsOf(q);for(var i=0;i<b.length;i++)if(b[i][0]===q.pmin&&b[i][1]===q.pmax)return b[i][2];return q.pmin+'–'+q.pmax+'k';}
function openNow(q){if(!q.open||!q.close)return null;var d=new Date(),m=d.getHours()*60+d.getMinutes();var a=q.open.split(':'),b=q.close.split(':');var o=+a[0]*60+ +a[1],c=+b[0]*60+ +b[1];if(c<=o)return m>=o||m<c;return m>=o&&m<c;}
function days(q){if(!q.lastVisit)return null;return Math.floor((Date.now()-q.lastVisit)/864e5);}
function weight(q){var w=((q.score||3.5)/3);var d=days(q);w*=d==null?1.5:(d<7?0.2:Math.min(1.5,0.5+d/30));if(q.again==='yes')w*=(S.f.mood==='Khám phá'?0.6:1.3);return w;}
function ready(q){return !!q.form&&q.again!=='no';}
function match(q,ignore){var f=S.f;ignore=ignore||{};
 if(!ready(q))return false;
 if(f.mood&&!ignore.mood){if(f.mood==='Khám phá'){if(q.visits&&!q.wish)return false;}else if((q.moods||[]).indexOf(f.mood)<0)return false;}
 if(f.price!=null&&!ignore.price){var b=FOOD[f.price];if(q.pmin==null||isSweet(q)||q.pmin>=b[1]||q.pmax<=b[0])return false;}
 if(f.cuisine.length&&!ignore.cuisine&&f.cuisine.indexOf(q.cuisine)<0)return false;
 if(f.type.length&&!ignore.type&&f.type.indexOf(q.type)<0)return false;
 if(f.group.length&&!ignore.group&&f.group.indexOf(groupOf(q.form))<0)return false;
 if(f.area&&!ignore.area&&q.area!==f.area)return false;
 if(f.open&&!ignore.open&&openNow(q)===false)return false;
 return true;}
function cands(ignore){return S.quan.filter(function(q){return match(q,ignore);});}
function catsOf(list){var m={};list.forEach(function(q){m[q.form]=1;});var ks=Object.keys(m),ord=function(a,b){return FORM.indexOf(a)-FORM.indexOf(b);};S.catTotal=ks.length;if(ks.length<=8)return ks.sort(ord);var key=ks.slice().sort().join('|');if(S.ck!==key||!S.cc){S.ck=key;for(var i=ks.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=ks[i];ks[i]=ks[j];ks[j]=t;}S.cc=ks.slice(0,8).sort(ord);}return S.cc;}
function pick(list){list=list.filter(function(q){return S.skip.indexOf(q.id)<0;});if(!list.length)return null;var t=0;list.forEach(function(q){t+=weight(q);});var r=Math.random()*t;for(var i=0;i<list.length;i++){r-=weight(list[i]);if(r<=0)return list[i];}return list[list.length-1];}
function activeFilters(){var f=S.f,a=[];if(f.mood)a.push(['mood',f.mood]);if(f.price!=null)a.push(['price',FOOD[f.price][2]]);f.cuisine.forEach(function(c){a.push(['cuisine',c]);});f.type.forEach(function(c){a.push(['type',c]);});f.group.forEach(function(c){a.push(['group',c]);});if(f.area)a.push(['area',f.area]);if(f.open)a.push(['open','Đang mở']);return a;}
function areas(){var m={};S.quan.forEach(function(q){if(q.area)m[q.area]=1;});return Object.keys(m).sort();}
function goodDishes(q){return (q.dishes||[]).filter(function(d){return d.score>=4;}).sort(function(a,b){return b.score-a.score;});}
function mapsHref(q){return q.mapUrl||('https://www.google.com/maps/search/'+encodeURIComponent(q.name+(q.area?' '+q.area:'')));}
function dueMeal(){var now=Date.now();return S.bua.filter(function(b){return !b.rated&&!b.dismissed&&now-b.at>3*36e5;}).sort(function(a,b){return b.at-a.at;})[0]||null;}
function when(t){var d=new Date(t),n=new Date();var hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);var dd=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);if(dd===0)return 'Hôm nay '+hm;if(dd===1)return 'Hôm qua '+hm;return d.getDate()+'/'+(d.getMonth()+1)+' '+hm;}


/* ---------- import from Google Takeout ---------- */
function parseCSV(t){t=t.replace(/^﻿/,'');var rows=[],row=[],cur='',q=false;for(var i=0;i<t.length;i++){var c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r')cur+=c;}if(cur||row.length){row.push(cur);rows.push(row);}return rows;}
function fromCSV(text,list){var rows=parseCSV(text).filter(function(r){return r.some(function(c){return c&&c.trim();});});if(rows.length<2)return [];
 var hi=0;for(var i=0;i<Math.min(6,rows.length);i++){if(rows[i].some(function(c){return /^\s*url\s*$/i.test(c);})){hi=i;break;}}
 var head=rows[hi].map(function(c){return (c||'').trim().toLowerCase();}),data=rows.slice(hi+1);
 var ti=head.findIndex(function(c){return /title|tiêu đề|^tên/.test(c);});if(ti<0)ti=0;
 var ni=head.findIndex(function(c){return /note|ghi chú/.test(c);});
 var ui=-1,best=0;for(var c=0;c<head.length;c++){var n=0;data.forEach(function(r){if(/^https?:\/\//i.test((r[c]||'').trim()))n++;});if(n>best){best=n;ui=c;}}
 return data.map(function(r){return {name:(r[ti]||'').trim(),mapUrl:ui>=0?(r[ui]||'').trim():'',note:ni>=0?(r[ni]||'').trim():'',list:list};}).filter(function(x){return x.name&&!/^https?:\/\//i.test(x.name);});}
function fromJSON(text,list){var j;try{j=JSON.parse(text);}catch(e){return [];}var fs=j&&j.features;if(!Array.isArray(fs))return [];
 return fs.map(function(f){var p=f.properties||{},loc=p.location||{},g=f.geometry&&f.geometry.coordinates;return {name:String(loc.name||p.Title||p.name||'').trim(),mapUrl:String(p['Google Maps URL']||p.google_maps_url||''),note:String(loc.address||''),list:list,lat:g?g[1]:undefined,lng:g?g[0]:undefined};}).filter(function(x){return x.name;});}
function readText(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result));};r.onerror=rej;r.readAsText(f);});}
function baseName(p){return p.split('/').pop().replace(/\.(csv|json)$/i,'');}
function handleImport(files){var arr=Array.prototype.slice.call(files||[]);if(!arr.length)return;S.work='Đang đọc file…';render();
 var out=[],skipped=[];
 function one(f){var nm=f.name||'';
  if(/\.zip$/i.test(nm)){if(!window.JSZip){skipped.push(nm+' (chưa mở được file .zip ở lần này, hãy giải nén rồi chọn các file .csv)');return Promise.resolve();}
   return window.JSZip.loadAsync(f).then(function(z){var ps=[];z.forEach(function(path,e){if(e.dir)return;if(/(^|\/)(Saved|Đã lưu)\/[^\/]+\.csv$/i.test(path))ps.push(e.async('string').then(function(t){out=out.concat(fromCSV(t,baseName(path)));}));else if(/Saved Places\.json$/i.test(path)||/Địa điểm đã lưu\.json$/i.test(path))ps.push(e.async('string').then(function(t){out=out.concat(fromJSON(t,'Đã gắn sao'));}));});return Promise.all(ps);}).catch(function(){skipped.push(nm+' (không đọc được)');});}
  if(/\.csv$/i.test(nm))return readText(f).then(function(t){out=out.concat(fromCSV(t,baseName(nm)));}).catch(function(){skipped.push(nm);});
  if(/\.json$/i.test(nm))return readText(f).then(function(t){out=out.concat(fromJSON(t,baseName(nm)));}).catch(function(){skipped.push(nm);});
  skipped.push(nm+' (không phải .zip, .csv hay .json)');return Promise.resolve();}
 Promise.all(arr.map(one)).then(function(){S.work=null;
  var seen={},have={};S.quan.forEach(function(q){have[(q.name||'').toLowerCase()]=1;if(q.mapUrl)have[q.mapUrl]=1;});
  var items=[];out.forEach(function(x){var k=(x.mapUrl||x.name).toLowerCase();if(seen[k])return;seen[k]=1;x.name=x.name.slice(0,80);x.dup=!!(have[x.name.toLowerCase()]||(x.mapUrl&&have[x.mapUrl]));x.on=!x.dup;items.push(x);});
  items=items.slice(0,600);
  if(!items.length){snack(skipped.length?'Không đọc được: '+skipped.join('; '):'Không tìm thấy địa điểm nào trong file. Hãy chọn file .zip của Takeout hoặc các file .csv trong thư mục Saved.');return;}
  S.imp={items:items,skipped:skipped};S.sheet='imp';render();});}
function impLists(){var m={};S.imp.items.forEach(function(x){m[x.list]=m[x.list]||{n:0,on:0};m[x.list].n++;if(x.on)m[x.list].on++;});return m;}
function impSheet(){var im=S.imp,ls=impLists(),on=im.items.filter(function(x){return x.on;}).length,dup=im.items.filter(function(x){return x.dup;}).length;
 var h='<div class="row" style="justify-content:space-between"><div class="col grow" style="gap:2px"><h2 class="big" style="color:var(--pink)">NHẬP TỪ GOOGLE MAPS</h2><div class="mute">Tìm thấy '+im.items.length+' địa điểm trong '+Object.keys(ls).length+' danh sách'+(dup?' · '+dup+' cái đã có sẵn nên bỏ tick':'')+'</div></div><button class="btn" style="width:44px;height:44px;padding:0" data-act="close" aria-label="Đóng">'+ic('x',20)+'</button></div>';

 h+='<div class="col" style="gap:6px"><div class="lbl">Danh sách, chạm để chọn hoặc bỏ cả danh sách</div><div class="wrap">'+Object.keys(ls).map(function(k){return chip(k+' · '+ls[k].on+'/'+ls[k].n,ls[k].on>0,'implist',k);}).join('')+'</div></div>';
 h+='<div class="card" style="padding:2px 14px;max-height:38vh;overflow:auto">'+im.items.map(function(x,i){return '<label class="row" style="min-height:48px;border-bottom:1px solid #3F3746"><input type="checkbox" data-f="imp" data-i="'+i+'"'+(x.on?' checked':'')+' style="flex:none;width:22px;height:22px;accent-color:#FF9BD2"><span class="col grow" style="gap:0"><span class="ell" style="font-weight:600">'+esc(x.name)+'</span><span class="mute ell" style="font-size:11px">'+esc(x.list)+(x.dup?' · đã có':'')+(x.note?' · '+esc(x.note):'')+'</span></span></label>';}).join('')+'</div>';
 h+='<div class="mute">Quán nhập vào sẽ nằm trong Hộp chờ, kèm link để chỉ đường. File của Google không có giá, giờ mở cửa hay loại món, nên bạn cần gắn tag.</div><div class="row"><button class="btn pri grow" data-act="impsave"'+(on?'':' disabled')+'>Nhập '+on+' quán vào Hộp chờ</button><button class="btn" data-act="close">Bỏ</button></div>';
 return sheetWrap('Nhập từ Google Maps',h);}
function runQueue(list,fn,label){var i=0,n=list.length;return new Promise(function(done){function next(){if(i>=n){S.work=null;done();return;}var batch=list.slice(i,i+4);i+=batch.length;S.work=label+' '+Math.min(i,n)+'/'+n+'…';var w=document.getElementById('work');if(w)w.textContent=S.work;Promise.all(batch.map(fn)).then(next,next);}next();});}
function impSave(){var items=S.imp.items.filter(function(x){return x.on;}),t=Date.now();S.sheet=null;S.imp=null;S.busy=true;S.work='Đang nhập…';render();
 var qs=items.map(function(x,i){var q={id:uid('q')+i,name:x.name,area:'',mapUrl:x.mapUrl||'',note:x.note||'',list:x.list,form:'',cuisine:'',type:'',moods:[],created:t+i,visits:0,dishes:[]};if(x.lat!=null){q.lat=x.lat;q.lng=x.lng;}return q;});
 runQueue(qs,function(q){S.quan.push(q);return db?db.collection('quan').doc(q.id).set(bodyOf(q)):Promise.resolve();},'Đang nhập').then(function(){S.busy=false;S.tab='list';S.seg='all';S.detail=null;snack('Đã nhập '+qs.length+' quán vào Hộp chờ.');window.scrollTo(0,0);});}
function inboxNoSug(){return S.quan.filter(function(q){return !q.form&&!q.sug;});}

 return '<div class="card col" style="padding:12px 14px;gap:8px"><div class="row" style="gap:12px">'+blob(q,i%2)+'<div class="col grow" style="gap:2px"><div class="qname">'+esc(q.name)+'</div><div class="mute">AI đoán từ tên quán</div></div></div><div class="wrap">'+[sg.form,sg.cuisine?'Món '+sg.cuisine:'',sg.type].filter(Boolean).map(function(t){return '<span class="pill" style="border:1.5px dashed var(--lime);background:transparent;color:var(--lime)">'+esc(t)+'</span>';}).join('')+'</div><div class="row"><button class="btn sm pri grow" data-act="oksug" data-id="'+esc(q.id)+'">Duyệt</button><button class="btn sm grow" data-act="edit" data-id="'+esc(q.id)+'">Sửa</button></div></div>';}

/* ---------- home ---------- */

 var stops=cols.map(function(c,i){return c+' '+(i*step)+'deg '+((i+1)*step)+'deg';}).join(', ');var sp='';

 case 'export':exportData();break;
 case 'oksug':var oq=qById(id);if(oq&&oq.sug){saveQ(applySug(oq));render();}break;
 case 'okall':var al=S.quan.filter(function(q){return !q.form&&q.sug&&q.sug.food&&q.sug.form;});S.busy=true;runQueue(al,function(q){return saveQ(applySug(q));},'Đang duyệt').then(function(){S.busy=false;snack('Đã đưa '+al.length+' quán vào vòng quay.');});break;
 case 'delnow':var xq=qById(id);delQ(id);snack('Đã xóa "'+(xq?xq.name:'quán')+'".',xq);break;
 case 'fmulti':var p=v.split('|'),arr=S.f[p[0]],ix=arr.indexOf(p[1]);if(ix<0)arr.push(p[1]);else arr.splice(ix,1);saveF();render();break;
 case 'farea':S.f.area=S.f.area===v?null:v;saveF();render();break;
 case 'fopen':S.f.open=!S.f.open;saveF();render();break;
 case 'fclear':S.f.cuisine=[];S.f.type=[];S.f.group=[];S.f.area=null;S.f.open=false;saveF();render();break;
 case 'unf':var k=el.getAttribute('data-k');if(k==='cuisine'||k==='type'||k==='group')S.f[k]=S.f[k].filter(function(x){return x!==v;});else if(k==='open')S.f.open=false;else S.f[k]=null;saveF();render();break;
 case 'spin':spin();break;
 case 'skipwheel':S.skip=[];S.cat=null;S.result=pick(cands());if(S.result){S.cat=S.result.form;S.phase='done';}render();break;
 case 'fav':var fv=S.quan.filter(function(q){return ready(q)&&q.again==='yes';});S.skip=[];S.result=pick(fv);if(S.result){S.cat=null;S.phase='done';render();}else snack('Chưa có quán quen nào. Gắn "Sẽ quay lại" khi chấm điểm để có.');break;
 case 'other':if(S.result)S.skip.push(S.result.id);var pool=S.cat?cands().filter(function(q){return q.form===S.cat;}):S.quan.filter(function(q){return ready(q)&&q.again==='yes';});var nx=pick(pool);if(nx){S.result=nx;render();}else{S.skip=[];snack('Hết quán khác trong nhóm này rồi. Thử Quay lần nữa.');}break;
 case 'again':resetSpin();render();setTimeout(spin,60);break;
 case 'reset':resetSpin();render();break;
 case 'commit':if(S.result)commit(S.result);break;
 case 'commitq':var cq=qById(id);if(cq){S.cat=null;commit(cq);}break;
 case 'undo':if(S.commit){delB(S.commit.id);S.commit=null;S.phase=S.result?'done':'idle';render();}break;
 case 'rate':var bb=S.bua.find(function(x){return x.id===id;});if(bb)openRate(bb);break;
 case 'later':var lb=S.bua.find(function(x){return x.id===id;});if(lb){saveB(Object.assign({},lb,{dismissed:true}));render();}break;
 case 'dstar':var di=+el.getAttribute('data-i'),dn=+el.getAttribute('data-n');S.rate.dishes[di].score=S.rate.dishes[di].score===dn?0:dn;render();break;
 case 'qstar':var qn=+el.getAttribute('data-n');S.rate.manual=S.rate.manual===qn?0:qn;render();break;
 case 'ragain':S.rate.again=S.rate.again===v?null:v;render();break;
 case 'adddish':var nm=(S.rate.newdish||'').trim();if(nm){S.rate.dishes.push({name:nm.slice(0,80),score:0});S.rate.newdish='';render();var ni=document.getElementById('nd');if(ni)ni.focus();}break;
 case 'saverate':saveRate();break;
 case 'seg':S.seg=v;render();break;
 case 'reshuffle':S.ck=null;render();break;
 case 'dg':S.d.group=v;S.d.type='';S.d.n=24;render();break;
 case 'dp':S.d.price=S.d.price===+v?null:+v;S.d.n=24;render();break;
 case 'ds':S.d.sort=v;render();break;
 case 'dmine':S.d.mine=!S.d.mine;S.d.n=24;render();break;
 case 'dmore':S.d.n+=24;render();break;
 case 'dish':S.dish=S.dl&&S.dl[+el.getAttribute('data-i')];if(S.dish){S.sheet='dish';render();}break;
 case 'sort':S.sort=v;render();break;
 case 'open':S.sheet=null;S.tab='list';S.detail=id;render();window.scrollTo(0,0);break;
 case 'back':S.detail=null;render();break;
 case 'edit':S.draft=newDraft(qById(id));if(S.draft.sug){if(!S.draft.form&&S.draft.sug.food){S.draft.form=S.draft.sug.form;S.draft.cuisine=S.draft.cuisine||S.draft.sug.cuisine;S.draft.type=S.draft.type||S.draft.sug.type;}delete S.draft.sug;}S.draft.moods=S.draft.moods||[];S.tab='add';S.detail=null;render();window.scrollTo(0,0);break;
 case 'canceledit':var bid=S.draft&&S.draft.id;S.draft=null;S.tab='list';S.detail=bid;render();break;
 case 'dset':var ps=v.split('|'),d=S.draft;if(ps[0]==='moods'){var mi=d.moods.indexOf(ps[1]);if(mi<0)d.moods.push(ps[1]);else d.moods.splice(mi,1);}else{d[ps[0]]=d[ps[0]]===ps[1]?'':ps[1];if(ps[0]==='form'){d.pmin=null;d.pmax=null;}}render();break;
 case 'dprice':var bs=SWEET.indexOf(S.draft.form)>=0?DRINK:FOOD,bd=bs[+v];if(S.draft.pmin===bd[0]&&S.draft.pmax===bd[1]){S.draft.pmin=null;S.draft.pmax=null;}else{S.draft.pmin=bd[0];S.draft.pmax=bd[1];}render();break;
 case 'saveq':var dr=S.draft;if(!dr||!dr.name.trim())break;if(v==='full'&&!dr.form)break;var q=Object.assign({},dr);if(/^(Đã lấy tên|Link này)/.test(q.note||''))delete q.note;delete q.sug;q.name=q.name.trim().slice(0,80);q.area=(q.area||'').trim().slice(0,40);var isNew=!q.id;if(isNew){q.id=uid('q');q.created=Date.now();q.visits=0;q.dishes=[];}if(v==='quick'){q.form='';}
  saveQ(q);S.draft=isNew?newDraft():null;if(isNew){snack(q.form?'Đã lưu "'+q.name+'" vào vòng quay.':'Đã lưu "'+q.name+'" vào Hộp chờ.');}else{S.tab='list';S.detail=q.id;snack('Đã lưu thay đổi.');}window.scrollTo(0,0);break;
 case 'unban':var uq=qById(S.detail);if(uq){saveQ(Object.assign({},uq,{again:null}));render();}break;
 case 'del':if(S.delArm===id){var dq=qById(id);delQ(id);S.delArm=null;S.detail=null;snack('Đã xóa "'+(dq?dq.name:'quán')+'".',dq);}else{S.delArm=id;render();}break;
 case 'snackundo':if(S.snack&&S.snack.undo){saveQ(S.snack.undo);S.snack=null;render();}break;
 case 'seed':seed();break;
 }});
document.addEventListener('input',function(ev){var el=ev.target,f=el.getAttribute&&el.getAttribute('data-f');if(!f)return;
 if(f==='q'){S.q=el.value;clearTimeout(S.qt);S.qt=setTimeout(function(){var pos=el.selectionStart;render();var n=document.getElementById('q');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},250);return;}
 if(f==='dq'){S.d.q=el.value;S.d.n=24;clearTimeout(S.qt);S.qt=setTimeout(function(){var pos=el.selectionStart;render();var n=document.getElementById('dq');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}}},250);return;}
 if(f==='dtype'){S.d.type=el.value;S.d.n=24;render();return;}
 if(f==='newdish'){S.rate.newdish=el.value;return;}
 if(f==='imp'){S.imp.items[+el.getAttribute('data-i')].on=el.checked;var bt=document.querySelector('[data-act=impsave]');if(bt){var c=S.imp.items.filter(function(x){return x.on;}).length;bt.textContent='Nhập '+c+' quán vào Hộp chờ';bt.disabled=!c;}return;}
 if(f==='import'||f==='backup')return;
 var d=S.draft;if(!d)return;
 if(f==='wish'){d.wish=el.checked;return;}
 if(f==='name'){var val=el.value;if(/^https?:\/\//i.test(val.trim())){var pm=parseMaps(val.trim());d.mapUrl=val.trim();if(pm){d.name=pm.name;d.lat=pm.lat;d.lng=pm.lng;d.note='Đã lấy tên quán từ link. Kiểm tra lại tên rồi lưu.';}else{d.name='';d.note='Link này không chứa tên quán (thường là link rút gọn). Mình đã giữ link để chỉ đường, bạn gõ tên quán giúp.';}render();var ni=document.querySelector('[data-f=name]');if(ni)ni.focus();return;}
  var was=!!d.name.trim();d.name=val;if(was!==!!val.trim()){var pos=el.selectionStart;render();var n2=document.querySelector('[data-f=name]');if(n2){n2.focus();try{n2.setSelectionRange(pos,pos);}catch(e){}}}return;}
 d[f]=el.value;});
document.addEventListener('change',function(ev){var el=ev.target,f=el.getAttribute&&el.getAttribute('data-f');if(f==='import'&&el.files&&el.files.length)handleImport(el.files);if(f==='backup'&&el.files&&el.files[0])importBackup(el.files[0]);});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.sheet){S.sheet=null;render();}if(ev.key==='Enter'&&ev.target.id==='nd'){ev.preventDefault();var b=document.querySelector('[data-act=adddish]');if(b)b.click();}});
document.addEventListener('focusout',function(){setTimeout(function(){if(S.pending)soft();},0);});
render();init();
})();
</script>
